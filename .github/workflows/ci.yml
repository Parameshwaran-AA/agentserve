name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check agentserve bench tests scripts
      - name: Unit and contract tests
        run: pytest -q

  integration:
    # Drives the gateway with AGENTSERVE_BACKEND=vllm against mock workers that
    # speak the real wire format. Catches adapter, streaming, auth, and Redis
    # regressions that unit tests with a simulated backend cannot see.
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: End-to-end against mock vLLM workers
        env:
          INTEGRATION_REDIS_URL: redis://localhost:6379/1
        run: python scripts/integration_check.py

  gpu-harness:
    # The GPU validation harness cannot run without a GPU, but its planning,
    # argument handling, and prompt-prefix invariants can be checked on CPU --
    # which is where the expensive mistakes live. A broken prompt builder makes
    # a real GPU run silently measure nothing.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Dry-run the GPU plan
        run: |
          python scripts/gpu_validate.py --dry-run --replicas 2
          python scripts/gpu_validate.py --dry-run --replicas 4 --share-gpu
      - name: Notebook is valid JSON
        run: python -c "import json; json.load(open('notebooks/gpu_validation.ipynb'))"

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Replay traces and gate on the policy still winning
        run: |
          python -m bench.run --sessions 300 --seeds 4 | tee bench.txt
          python - <<'PY'
          import json, subprocess
          out = subprocess.check_output(
              ["python", "-m", "bench.run", "--sessions", "300",
               "--seeds", "4", "--json"], text=True)
          d = json.loads(out)
          base, agent = d["baseline"], d["agentserve"]
          assert agent["gpu_hit_rate"] > base["gpu_hit_rate"] + 0.20, "hit-rate gain regressed"
          assert agent["gpu_busy_ms"] < base["gpu_busy_ms"] * 0.60, "compute saving regressed"
          print("benchmark gates passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: bench.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentserve:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name ag -p 8000:8000 agentserve:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && break || sleep 2
          done
          if ! curl -sf http://localhost:8000/health; then
            echo "gateway never became healthy"; docker logs ag; docker rm -f ag; exit 1
          fi
          docker rm -f ag

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm
      - name: Default values render
        run: helm template agentserve deploy/helm > /dev/null
      - name: Multi-pod with Redis renders
        run: |
          helm template agentserve deploy/helm \
            --set gateway.replicaCount=3 \
            --set redis.enabled=true \
            --set redis.url=redis://agentserve-redis:6379/0 > /dev/null
      - name: Multi-pod WITHOUT Redis must be rejected
        run: |
          if helm template agentserve deploy/helm --set gateway.replicaCount=3 2>/dev/null; then
            echo "chart rendered an unsafe multi-pod config"; exit 1
          fi
          echo "guard correctly rejected multi-pod without a shared session store"
