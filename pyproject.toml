[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentserve"
version = "1.0.0"
description = "Agent-aware LLM serving gateway for Kubernetes GPU clusters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "tiktoken>=0.6",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "fakeredis>=2.20",
    "pyyaml>=6.0",
    "ruff>=0.4",
]

[project.scripts]
agentserve-bench = "bench.run:main"

# Explicit package list. Auto-discovery fails on this layout: setuptools sees
# bench/, deploy/ and notebooks/ alongside agentserve/ and refuses to guess.
[tool.setuptools]
packages = ["agentserve", "agentserve.backends", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
