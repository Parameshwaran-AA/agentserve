[project]
name = "agentserve"
version = "0.1.0"
description = "Agent-aware LLM serving gateway for Kubernetes GPU clusters"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "tiktoken>=0.6",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "fakeredis>=2.20", "ruff>=0.4"]

[project.scripts]
agentserve-bench = "bench.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options.anyio]
