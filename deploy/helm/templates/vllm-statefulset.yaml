{{- /*
A StatefulSet, not a Deployment: session affinity needs stable per-replica DNS
names so the gateway's session->replica map stays meaningful across restarts.
A Deployment would hand out new pod names and every mapping would go stale at
once.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  clusterIP: None          # headless: gives each pod its own DNS record
  selector:
    app.kubernetes.io/name: agentserve-vllm
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  serviceName: {{ .Release.Name }}-vllm
  replicas: {{ .Values.vllm.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentserve-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentserve-vllm
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model={{ .Values.vllm.model }}
            {{- if .Values.vllm.enablePrefixCaching }}
            - --enable-prefix-caching
            {{- end }}
            - --swap-space={{ .Values.vllm.swapSpaceGb }}
            - --gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60      # model load is slow
            periodSeconds: 15
            failureThreshold: 40
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
