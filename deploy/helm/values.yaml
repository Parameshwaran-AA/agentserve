image:
  repository: ghcr.io/example/agentserve
  tag: "1.0.0"
  pullPolicy: IfNotPresent

gateway:
  # Safe to raise ONLY when redis.enabled is true. The chart refuses to render
  # otherwise: with a process-local session map, extra gateway pods disagree
  # about where each session lives and affinity silently degrades to
  # round-robin. That failure is invisible -- traffic still flows, the cache
  # hit rate just quietly collapses -- so it is enforced at template time.
  replicaCount: 1
  port: 8000
  apiKeySecret: ""        # name of a Secret with key `api-key`; empty disables auth
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "4Gi" }

redis:
  enabled: false
  url: ""                 # e.g. redis://agentserve-redis:6379/0
  sessionTtlSeconds: 3600

# vLLM workers the gateway routes across. Prefix caching must be on -- it is the
# cache the router steers sessions toward. swapSpaceGb backs the DRAM tier.
vllm:
  replicaCount: 4
  model: mistralai/Mistral-7B-Instruct-v0.3
  enablePrefixCaching: true
  swapSpaceGb: 16
  gpuMemoryUtilization: 0.90
  timeoutSeconds: 300
  maxRetries: 2
  resources:
    limits:
      # amd.com/gpu on ROCm nodes, nvidia.com/gpu on CUDA nodes
      nvidia.com/gpu: 1

policy:
  pinThresholdMs: 2000
  offloadThresholdMs: 300000
  deadSessionMs: 600000
  affinityQueueLimit: 6
  gpuCacheTokens: 150000
  dramCacheTokens: 1400000

predictor:
  ewmaAlpha: 0.3
  priorMs: 5000
  minObservations: 2

serviceMonitor:
  enabled: true
  interval: 15s
